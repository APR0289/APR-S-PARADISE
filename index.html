<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APR'S PARADISE</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #1a1c23;
      --accent-green: #00e676;
      --text-main: #ffffff;
      --text-muted: #9e9e9e;
      --border-color: #2b2e3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Gatekeeper Login Screen */
    #gatekeeper {
      position: fixed;
      inset: 0;
      background: #090a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .login-box h1 {
      color: var(--accent-green);
      font-size: 1.6rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #111319;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
      text-align: center;
      letter-spacing: 2px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
    }

    .error-msg {
      color: #ff5252;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* Dashboard */
    #app {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent-green);
    }

    .player-section {
      margin-bottom: 24px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: block;
    }

    .player-meta {
      padding: 12px 16px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .current-channel {
      font-weight: bold;
      font-size: 1rem;
    }

    .current-quality {
      color: var(--accent-green);
      font-size: 0.85rem;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #252836;
      border-color: var(--accent-green);
      color: #fff;
    }

    .channel-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .quality-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .q-btn {
      padding: 6px 4px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #12141a;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }

    .q-btn:hover {
      border-color: var(--accent-green);
    }
  </style>
</head>
<body>

  <!-- Login Gate -->
  <div id="gatekeeper">
    <div class="login-box">
      <h1>APR'S PARADISE</h1>
      <input type="text" id="secretCode" placeholder="ENTER SECRET CODE" autocomplete="off" autocapitalize="characters" />
      <button type="button" id="enterBtn" onclick="checkAccess()">ENTER</button>
      <div class="error-msg" id="errorMsg">Incorrect Code. Try again.</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="app">
    <header>
      <h1>APR'S PARADISE</h1>
      <span style="font-size: 0.8rem; color: var(--text-muted);">LIVE SPORTS</span>
    </header>

    <div class="player-section">
      <video id="mainPlayer" controls autoplay playsinline></video>
      <div class="player-meta">
        <span class="current-channel" id="nowPlayingTitle">Select a channel below</span>
        <span class="current-quality" id="nowPlayingQuality"></span>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchSection('live')">24/7 CHANNELS</button>
      <button class="tab-btn" onclick="switchSection('match')">MATCH TIME ONLY</button>
    </div>

    <div id="liveSection" class="channel-list"></div>
    <div id="matchSection" class="channel-list" style="display: none;"></div>
  </div>

  <script>
    const SECRET = "WORLDWIDE2026";
    let hlsInstance = null;

    const channels = [
      { id: "fox501", name: "FOX 501 (AUSTRALIA)", section: "live", stable: "", high: "", low: "" },
      { id: "skynz", name: "SKY SPORTS (NEW ZEALAND)", section: "live", stable: "", high: "", low: "" },
      { id: "skycricket", name: "SKY SPORTS CRICKET (LONDON)", section: "live", stable: "", high: "", low: "" },
      { id: "skymain", name: "SKY SPORTS MAIN EVENT (LONDON)", section: "live", stable: "", high: "", low: "" },
      { id: "skyuhd", name: "SKY SPORT UHD (LONDON)", section: "live", stable: "", high: "", low: "" },
      { id: "willow1", name: "WILLOW (AMERICA)", section: "live", stable: "", high: "", low: "" },
      { id: "willow2", name: "WILLOW 2 (AMERICA)", section: "live", stable: "", high: "", low: "" },
      { 
        id: "hub1", 
        name: "HUB SPORTS (SINGAPORE)", 
        section: "live", 
        stable: "", 
        high: "http://ossyott.site:80/live/3X7L45AKL2351JY/rd1UinOTM7/1090650.m3u8", 
        low: "" 
      },
      { id: "hub2", name: "HUB SPORTS (SINGAPORE) [S2]", section: "live", stable: "", high: "", low: "" },
      { id: "star", name: "STAR SPORTS (INDIA)", section: "live", stable: "", high: "", low: "" },
      { id: "sony", name: "SONY SPORTS (INDIA)", section: "live", stable: "", high: "", low: "" },
      { id: "tnt", name: "TNT SPORTS (LONDON)", section: "live", stable: "", high: "", low: "" },
      { id: "match1", name: "MATCH EVENT 1", section: "match", stable: "", high: "", low: "" },
      { id: "match2", name: "MATCH EVENT 2", section: "match", stable: "", high: "", low: "" }
    ];

    function checkAccess() {
      const entered = document.getElementById("secretCode").value.trim().toUpperCase();
      if (entered === SECRET) {
        document.getElementById("gatekeeper").style.display = "none";
        document.getElementById("app").style.display = "block";
        buildChannelGrids();
      } else {
        document.getElementById("errorMsg").style.display = "block";
      }
    }

    function switchSection(type) {
      const tabs = document.querySelectorAll(".tab-btn");
      tabs.forEach(t => t.classList.remove("active"));
      if (type === 'live') {
        tabs[0].classList.add("active");
        document.getElementById("liveSection").style.display = "grid";
        document.getElementById("matchSection").style.display = "none";
      } else {
        tabs[1].classList.add("active");
        document.getElementById("liveSection").style.display = "none";
        document.getElementById("matchSection").style.display = "grid";
      }
    }

    function playStream(channelName, url, qualityLabel) {
      if (!url) {
        alert("No stream URL linked yet for this source.");
        return;
      }
      const video = document.getElementById("mainPlayer");
      document.getElementById("nowPlayingTitle").innerText = channelName;
      document.getElementById("nowPlayingQuality").innerText = qualityLabel;

      if (Hls.isSupported() && url.includes(".m3u8")) {
        if (hlsInstance) { hlsInstance.destroy(); }
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else {
        video.src = url;
        video.play();
      }
    }

    function buildChannelGrids() {
      const liveBox = document.getElementById("liveSection");
      const matchBox = document.getElementById("matchSection");
      liveBox.innerHTML = "";
      matchBox.innerHTML = "";

      channels.forEach(ch => {
        const card = document.createElement("div");
        card.className = "channel-card";
        card.innerHTML = `
          <div class="channel-title">${ch.name}</div>
          <div class="quality-buttons">
            <button class="q-btn" onclick="playStream('${ch.name}', '${ch.stable}', 'STABLE (4-8 MBPS)')">STABLE</button>
            <button class="q-btn" onclick="playStream('${ch.name}', '${ch.high}', 'HIGH (10-15 MBPS)')">HIGH</button>
            <button class="q-btn" onclick="playStream('${ch.name}', '${ch.low}', 'LOW (4-6 MBPS)')">LOW</button>
          </div>
        `;
        if (ch.section === "live") {
          liveBox.appendChild(card);
        } else {
          matchBox.appendChild(card);
        }
      });
    }

    // Allow hitting Enter on mobile keyboard
    document.getElementById("secretCode").addEventListener("keyup", function(event) {
      if (event.key === "Enter") {
        checkAccess();
      }
    });
  </script>
</body>
</html>
