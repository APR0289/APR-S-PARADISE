events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 8080;

        location / {
            # Handle browser preflight CORS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            # Forward to IPTV server without path truncation
            proxy_pass http://ossyott.site:80;

            # Match NS Player / VLC behavior to prevent anti-restream blocks
            proxy_set_header Host ossyott.site;
            proxy_set_header User-Agent "Lavf/58.76.100";
            proxy_set_header Accept "*/*";
            proxy_set_header Connection "";

            # Disable buffering for live video chunk streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;

            # Inject CORS headers so web players can read the stream
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
        }
    }
}
