events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 8080;

        location /live/ {
            # Handle CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            # Forward the exact path with port 80 preserved
            proxy_pass http://ossyott.site:80/live/;
            
            proxy_set_header Host ossyott.site:80;
            proxy_set_header User-Agent "Lavf/58.76.100";
            proxy_set_header Accept "*/*";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            # Video streaming optimizations
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Add CORS headers to all responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
        }

        # Catch-all for .ts chunks that are served from root or subpaths
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                return 204;
            }

            proxy_pass http://ossyott.site:80;
            proxy_set_header Host ossyott.site:80;
            proxy_set_header User-Agent "Lavf/58.76.100";
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
        }
    }
}
